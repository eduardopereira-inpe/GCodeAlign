[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pcb-gcode-align"
version = "0.1.0"
description = "Desktop tool for safely rotating PCB G-code around a fixed origin."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
authors = [
    { name = "Eduardo Pereira" },
]
keywords = ["cnc", "gcode", "pcb", "alignment", "flatcam"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Manufacturing",
    "Natural Language :: Portuguese (Brazilian)",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "matplotlib>=3.7,<4",
]

[project.optional-dependencies]
dev = [
    "build>=1,<2",
    "pytest>=7,<9",
    "twine>=5,<7",
]

[project.urls]
Homepage = "https://github.com/eduardopereira-inpe/GCodeAlign"
Repository = "https://github.com/eduardopereira-inpe/GCodeAlign"
Issues = "https://github.com/eduardopereira-inpe/GCodeAlign/issues"

[project.gui-scripts]
gcodealign = "pcb_alignment.main:main"

[tool.setuptools.packages.find]
include = ["pcb_alignment*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
